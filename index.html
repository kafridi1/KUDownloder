<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok & YouTube Downloader</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#111;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{width:100%;max-width:600px;background:#1e1e1e;padding:30px 20px;border-radius:20px;text-align:center;box-shadow:0 0 20px rgba(0,0,0,0.5)}
h1{font-size:28px;margin-bottom:10px}
p{color:#aaa;font-size:15px;margin-bottom:20px}
input{width:100%;padding:15px;border-radius:12px;border:none;outline:none;font-size:16px}
button{width:100%;padding:15px;background:#fe2c55;color:white;border:none;border-radius:12px;font-size:17px;font-weight:bold;margin-top:15px;cursor:pointer}
button:active{transform:scale(0.98)}
#result{margin-top:20px;word-break:break-all}
#result a{color:#25F4EE;font-weight:bold}
.footer{margin-top:20px;font-size:12px;color:#666}
@media (max-width:480px){.container{padding:20px 15px;border-radius:15px}h1{font-size:22px}p{font-size:14px}input,button{font-size:15px;padding:13px}}
@media (min-width:769px){.container{max-width:650px;padding:40px}h1{font-size:32px}}
</style>
</head>
<body>
<div class="container">
  <h1>🎬 Video Downloader</h1>
  <p>TikTok & YouTube Video Download Karo</p>
  <input type="text" id="url" placeholder="Yahan link paste karo...">
  <button onclick="download()">Download Video</button>
  <p id="result"></p>
  <div class="footer">Works on PC • Mobile • Tablet</div>
</div>
<script>
async function download(){
  let url = document.getElementById("url").value;
  if(!url){document.getElementById("result").innerText="Pehle link paste karo!";return;}
  document.getElementById("result").innerText="Wait karo, downloading...";
  let res = await fetch("/download?url=" + encodeURIComponent(url));
  let data = await res.json();
  if(data.success){
    document.getElementById("result").innerHTML = `<a href="${data.link}">Download Karne Ke Liye Yahan Click Karo</a>`;
  } else {
    document.getElementById("result").innerText = "Error: " + data.error;
  }
}
</script>
</body>
  </html>
